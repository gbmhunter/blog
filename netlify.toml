# Our global, build settings
[build]
   publish = "dist"      # the output diretory to push to the CDN after the build
   command = "npm run build"  # the command to build our site

[build.environment]
   # Astro 7 requires Node >= 22.12. Without this pin Netlify uses the Node
   # version that was current when the site was created, which is too old.
   # 24 matches the local dev environment (Node 24.x, current LTS).
   NODE_VERSION = "24"
